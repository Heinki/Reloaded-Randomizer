name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Windows validation
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Validate static configuration schemas
        run: >-
          python -c "from randomizer.config.static import REQUIRED_STATIC_CONFIGS,
          validate_static_configs; validate_static_configs(REQUIRED_STATIC_CONFIGS)"
      - name: Build launcher and APWorld
        shell: powershell
        run: .\build_exe.ps1 -Output 'release\CnCReloadedRandomizer.exe'

  linux-apworld:
    name: Linux APWorld build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - name: Build and audit APWorld
        run: |
          python Archipelago/build_apworld.py
          python -m Archipelago.audit

  archipelago-compatibility:
    name: Archipelago ${{ matrix.label }} generation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '0.6.7'
            commit: debe4cf035c7c15efe6fb95f72343af0d420c68c
          - label: '0.6.8-dev'
            commit: 1e1efa3f5c8fd0a63df0d0f95ec6c824e413318a
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up supported Archipelago Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install generation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements-runtime.txt
          schema==0.7.8 PyYAML==6.0.3 jellyfish==1.2.1
          jinja2==3.1.6 platformdirs==4.9.4 typing_extensions==4.15.0
          pathspec==1.0.4 bsdiff4==1.2.6
      - name: Build maximum-capacity fixture
        run: |
          python Archipelago/build_apworld.py --output-directory build/ap-smoke
          python tools/archipelago_generation_fixture.py build/ap-smoke/Players/Compatibility_Smoke.yaml
      - name: Check out pinned Archipelago core
        run: |
          git init build/archipelago-core
          git -C build/archipelago-core remote add origin https://github.com/ArchipelagoMW/Archipelago.git
          git -C build/archipelago-core fetch --depth 1 origin ${{ matrix.commit }}
          git -C build/archipelago-core checkout --detach FETCH_HEAD
      - name: Generate with the packaged APWorld
        run: |
          test "$(git -C build/archipelago-core rev-parse HEAD)" = "${{ matrix.commit }}"
          mkdir -p build/archipelago-core/custom_worlds build/archipelago-core/Players build/archipelago-core/output
          cp build/ap-smoke/cnc_reloaded.apworld build/archipelago-core/custom_worlds/
          cp build/ap-smoke/Players/Compatibility_Smoke.yaml build/archipelago-core/Players/
          cd build/archipelago-core
          SKIP_REQUIREMENTS_UPDATE=1 python Generate.py --player_files_path Players --outputpath output --skip_output --log_level warning

  codeql:
    name: CodeQL (Python)
    # Private repositories require GitHub Code Security before CodeQL can upload results.
    if: ${{ github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    # Dependency review has the same GitHub Code Security requirement on private repositories.
    if: ${{ github.event_name == 'pull_request' && (github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5
