name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  validation:
    name: Windows validation
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Validate static configuration schemas
        run: >-
          python -c "from randomizer.config.static import REQUIRED_STATIC_CONFIGS,
          validate_static_configs; validate_static_configs(REQUIRED_STATIC_CONFIGS)"
      - name: Build launcher and APWorld
        shell: powershell
        run: .\build_exe.ps1 -Output 'release\CnCReloadedRandomizer.exe'

  linux-apworld:
    name: Linux APWorld build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.txt
      - name: Build and audit APWorld
        run: |
          python Archipelago/build_apworld.py
          python -m Archipelago.audit

  codeql:
    name: CodeQL (Python)
    # Private repositories require GitHub Code Security before CodeQL can upload results.
    if: ${{ github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency review
    # Dependency review has the same GitHub Code Security requirement on private repositories.
    if: ${{ github.event_name == 'pull_request' && (github.event.repository.private == false || vars.CODE_SECURITY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@v5
