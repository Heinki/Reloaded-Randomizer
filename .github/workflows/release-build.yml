name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'V*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Archipelago release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Build complete Archipelago release
        shell: powershell
        run: .\build_archipelago_release.ps1 -OutputDirectory 'release'

      - name: Audit built Archipelago catalogue
        run: python -m Archipelago.audit

      - name: Verify release version tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python tools/write_release_manifest.py --verify-only
          --output-directory release --tag "$env:RELEASE_TAG"

      - name: Upload player downloads
        uses: actions/upload-artifact@v7
        with:
          name: CnCReloadedRandomizer-${{ github.sha }}
          path: |
            release/CnCReloadedRandomizer.exe
            release/cnc_reloaded.apworld
            release/release_manifest.json
            release/SHA256SUMS.txt
            release/CnCReloadedRandomizer-Archipelago-Setup.md
          if-no-files-found: error
          retention-days: 90

      - name: Prepare draft release for version tag
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetNames = @(
            'CnCReloadedRandomizer.exe'
            'cnc_reloaded.apworld'
            'release_manifest.json'
            'SHA256SUMS.txt'
            'CnCReloadedRandomizer-Archipelago-Setup.md'
          )
          $assets = $assetNames | ForEach-Object {
            (Resolve-Path -LiteralPath (Join-Path 'release' $_)).Path
          }
          $releaseState = (gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>&1) -join "`n"
          if ($LASTEXITCODE -eq 0) {
            if ($releaseState.Trim() -eq 'false') {
              Write-Host "::notice::Release $env:GITHUB_REF_NAME is already published. Skipping release upload; the verified bundle is available in this run's artifacts."
              exit 0
            }
            if ($releaseState.Trim() -ne 'true') {
              throw "Unexpected release state: $releaseState"
            }
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } elseif ($releaseState.Trim() -eq 'release not found') {
            gh release create $env:GITHUB_REF_NAME $assets `
              --draft `
              --verify-tag `
              --generate-notes `
              --title $env:GITHUB_REF_NAME
          } else {
            throw "Failed to look up release ${env:GITHUB_REF_NAME}: $releaseState"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload assets or create draft release $env:GITHUB_REF_NAME."
          }
